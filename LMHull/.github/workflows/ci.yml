# Build + test LMHull trên Windows.
# Lưu ý: GitHub chỉ đọc .github/ ở gốc repo — workflow này chạy được khi repo có gốc là thư mục LMHull.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build & test
        shell: pwsh
        run: ./build.ps1 -Configuration Release

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: artifacts/test-results
